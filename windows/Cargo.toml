[package]
name = "jabra-input-tracker"
version = "1.0.0"
edition = "2021"
description = "Locks the Jabra Elite 85h microphone input level (gain lock + 10% floor)"
repository = "https://github.com/Salobaka/jabra-mic-level-blocker"
license = "MIT"

[[bin]]
name = "JabraInputTracker"
path = "src/main.rs"

[dependencies]
native-windows-gui = "1.0.13"
windows-core = "0.58"

[dependencies.windows]
version = "0.58"
features = [
    "implement",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
