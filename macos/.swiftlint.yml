excluded:
  - .build

opt_in_rules:
  - empty_count
  - force_unwrapping
  - implicitly_unwrapped_optional
  - legacy_random
  - private_action
  - private_outlet
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - yoda_condition

disabled_rules:
  - trailing_comma
  - opening_brace

line_length:
  warning: 160
  error: 200

function_body_length:
  warning: 80
  error: 120

type_body_length:
  warning: 300
  error: 400

identifier_name:
  min_length:
    warning: 2
    error: 1

reporter: "xcode"
