name: windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - run: cargo fmt -- --check
      - run: cargo clippy --release -- -D warnings
      - run: cargo build --release
      - name: Smoke run
        run: ./target/release/JabraInputTracker.exe --list
      - uses: actions/upload-artifact@v4
        with:
          name: JabraInputTracker-windows-x64
          path: windows/target/release/JabraInputTracker.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: JabraInputTracker-windows-x64
          path: dist
      - name: Package
        run: cd dist && zip "JabraInputTracker-${{ github.ref_name }}-windows-x64.zip" JabraInputTracker.exe
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
